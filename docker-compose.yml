services:
  api:
    build: ./api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"

  web:
    build: ./web
    ports:
      - "5173:80"
    depends_on:
      - api

  # ollama:
